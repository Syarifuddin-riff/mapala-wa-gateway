services:
  - type: web
    name: mapala-wa-gateway
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEBHOOK_URL
        value: https://mapalaperegrina.gt.tc/whatsapp/webhook
